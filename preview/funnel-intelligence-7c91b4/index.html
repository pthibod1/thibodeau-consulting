<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Cross-Channel Funnel Intelligence · Thibodeau Consulting</title>
  <meta name="description" content="An unlisted Thibodeau Consulting portfolio prototype demonstrating cross-channel marketing funnel reporting with synthetic data.">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <style>
    :root {
      color-scheme: light;
      --navy: #0f2a43;
      --blue: #8fb6e6;
      --paper: #f4f8fc;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .preview-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 44px;
      padding: .55rem 1rem;
      background: var(--navy);
      border-bottom: 1px solid #0a2138;
      font-size: .78rem;
      letter-spacing: .02em;
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: .95rem;
      white-space: nowrap;
    }

    .status {
      color: #dbe8f7;
      text-align: right;
    }

    .dot {
      display: inline-block;
      width: .45rem;
      height: .45rem;
      margin: 0 .42rem 0 .2rem;
      border-radius: 50%;
      background: var(--blue);
      vertical-align: .05rem;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .fallback {
      position: fixed;
      inset: auto 1rem 1rem auto;
      z-index: -1;
      color: var(--navy);
    }

    @media (max-width: 560px) {
      .preview-bar { align-items: flex-start; }
      .status { max-width: 16rem; }
      .status .secondary { display: none; }
    }
  </style>
</head>
<body>
  <div class="preview-bar" role="note" aria-label="Prototype status">
    <span class="brand">Thibodeau Consulting</span>
    <span class="status"><span class="dot" aria-hidden="true"></span>Unlisted portfolio prototype <span class="secondary">· Synthetic data</span></span>
  </div>
  <iframe
    src="https://paul-funnel-intelligence.pthibod1.chatgpt.site"
    title="Interactive cross-channel funnel intelligence prototype"
    loading="eager"
    allow="fullscreen"
  ></iframe>
  <p class="fallback">If the prototype does not load, <a href="https://paul-funnel-intelligence.pthibod1.chatgpt.site">open it directly</a>.</p>
</body>
</html>
